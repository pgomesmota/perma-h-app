name: Temporary GreenCare pharmacy export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export Portuguese pharmacies
        run: python scripts/export_portugal_pharmacies.py

      - name: Upload CSV files
        uses: actions/upload-artifact@v4
        with:
          name: greencare-portugal-pharmacies
          path: pharmacy-export/
          if-no-files-found: error
          retention-days: 7
